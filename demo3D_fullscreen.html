<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chessground Demo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #board {
      width: 100vw;
      height: 100vh;
    }
  </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.183.2/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.183.2/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import { Chessground } from './dist/chessground.min.js';

      Chessground(document.getElementById('board'), { real3D: { sceneAssetUrl: 'assets/scene.glb' } });
    </script>
  </head>
  <body>
      <div id="board"></div>
  </body>
</html>
