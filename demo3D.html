<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chessground Demo</title>

    <link rel="stylesheet" type="text/css" href="assets/chessground.base.css" />
    <link rel="stylesheet" type="text/css" href="assets/chessground.brown.css" />
    <link rel="stylesheet" type="text/css" href="assets/chessground.cburnett.css" />
    <style>
      body {
        display: flex;
        flex-wrap: wrap;
      }

      body > div {
        margin: 10px;
      }

      .chessground {
        width: 500px;
        height: 500px;
      }

      cg-board {
        background-color: #bfcfdd;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.183.2/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.183.2/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import { Chessground } from './dist/chessground.min.js';

      Chessground(document.getElementById('board-1'), { real3D: { sceneAssetUrl: 'assets/scene.glb' }, fen: 'r2q2k1/1p6/p2p4/2pN1rp1/N1Pb2Q1/8/PP1B4/R6K b - - 2 25', });
      Chessground(document.getElementById('board-2'), { fen: 'r2q2k1/1p6/p2p4/2pN1rp1/N1Pb2Q1/8/PP1B4/R6K b - - 2 25', });
    </script>
  </head>
  <body>
    <div>
      basic board with 3D pieces
      <div class="chessground" id="board-1"></div>
    </div>
    <div>
      baisic board with 2D pieces
      <div class="chessground" id="board-2"></div>
    </div>
  </body>
</html>
